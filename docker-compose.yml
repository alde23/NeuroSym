version: '3.8'

services:
  # Rasa Duckling Rule-Based Haskell Entity Extraction Engine
  duckling:
    image: rasa/duckling:latest
    container_name: neurosym-duckling
    ports:
      - "8005:8000"
    restart: unless-stopped
    command: ["duckling-example-exe", "-p", "8000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # NeuroSym FastAPI Application & Advisory Engine
  neurosym:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurosym-api
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DUCKLING_URL=http://duckling:8000/parse
      - CORDIS_DB_PATH=cordis.duckdb
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      duckling:
        condition: service_started
    restart: unless-stopped
